name: Send scheduled readings

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: send-scheduled-readings
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build
        run: npm run build

      - name: Run worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          APP_BASE_URL: "https://line-fortune-bot-zs2z.onrender.com"
          FREE_CONSULTATION_LIMIT: "2"
          CONSULTATION_PRICE_JPY: "500"
          MIN_DELAY_MINUTES: "90"
          MAX_DELAY_MINUTES: "120"
          MAX_QUESTION_CHARS: "500"
          MAX_DAILY_CONSULTATIONS_PER_USER: "5"
          DAILY_AI_GENERATION_LIMIT: "200"
        run: npm run worker
